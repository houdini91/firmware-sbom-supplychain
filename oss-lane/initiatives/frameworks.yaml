# Initiative manifests — framework → control → the verifier report(s) that satisfy it.
#
# This is the declarative layer over the enforcing gate (adopted from the Valint/Scribe
# "initiative" model). The 21 always-emitted rego verifier_reports (plus firmware-freshly-measured,
# emitted only when a genuine flash-time FW_IMAGE measurement is supplied) stay the source of truth; this maps
# them to framework control IDs so a run can report per-control, per-framework coverage
# (and surface MISSING_EVIDENCE — a control whose satisfying report is absent from the VSA).
#
# `satisfied_by`: ALL listed reports must be isSuccess=true for the control to PASS.
# A report named here but absent from the VSA verifier_reports => MISSING_EVIDENCE.
# Consumed by verify-initiative.py against a signed VSA (predicate.verifierReports[]).

version: 1

initiatives:

  slsa.l2:
    name: "SLSA v1.0 — Build track L2"
    help: https://slsa.dev/spec/v1.0/levels
    controls:
      - id: provenance-exists
        name: "Provenance exists (L1)"
        description: "The build platform produces provenance describing how the artifact was built."
        citation: "SLSA v1.0 — Build L1 (Provenance exists)"
        canonical: build-provenance-exists
        satisfied_by: [provenance-identity]
      - id: provenance-authentic
        name: "Provenance authentic — platform-generated (L2)"
        description: "Provenance is generated and signed by the hosted build platform, so the build itself cannot forge it."
        citation: "SLSA v1.0 — Build L2 (Hosted build, signed provenance)"
        canonical: build-provenance
        satisfied_by: [slsa-provenance, slsa-level-floor]
      - id: subject-binding
        name: "Provenance/SBOM bound to one subject digest"
        description: "Provenance and SBOM name the same subject digest, so the evidence is verifiably about one artifact."
        citation: "SLSA v1.0 — Provenance subject (in-toto Statement binding)"
        canonical: evidence-subject-binding
        satisfied_by: [sbom-binding, evidence-chain-bound]

  ssdf:
    name: "NIST SSDF (SP 800-218 v1.1)"
    help: https://csrc.nist.gov/pubs/sp/800/218/final
    controls:
      # Schema (A2b-Minimal): id = the FRAMEWORK'S own control number; name = short label;
      # description = what the control requires, in the framework's language; citation =
      # the exact framework reference a reader can look up; canonical = a forward-compat
      # crosswalk id shared by equivalent controls in OTHER frameworks (the seam toward a
      # shared catalog / OpenCRE / CDXA, without building one yet); satisfied_by = the
      # verifier report(s) that discharge it (the source of truth — rego tags derive FROM here).
      - id: PS.2.1
        name: "Provide integrity-verification info to acquirers"
        description: "Provide acquirers a mechanism to verify the integrity of each release — e.g. a signature or cryptographic hash over the released artifact."
        citation: "NIST SP 800-218 v1.1 — PS.2.1"
        canonical: release-integrity-verification
        satisfied_by: [attestation-signature]
      - id: PS.3.1
        name: "Archive + provide provenance/SBOM per release"
        description: "Securely archive the necessary files (provenance, SBOM) and provide a way for acquirers to obtain them for each release."
        citation: "NIST SP 800-218 v1.1 — PS.3.1 (provenance), PS.3.2 (SBOM)"
        canonical: release-provenance-and-sbom
        satisfied_by: [sbom-present, provenance-identity]
      - id: PO.3.2
        name: "Deploy/operate tools securely (toolchain pinned)"
        description: "Follow recommended security practices to deploy, operate, and maintain the toolchain — including pinning tool versions so the build is reproducible and tamper-evident."
        citation: "NIST SP 800-218 v1.1 — PO.3.2"
        canonical: toolchain-integrity
        satisfied_by: [build-tools-signed]
      - id: PO.3.3
        name: "Tools emit artifacts of secure practices"
        description: "Configure the toolchain to generate artifacts of evidence (e.g. SLSA provenance) that support the secure use of the tools."
        citation: "NIST SP 800-218 v1.1 — PO.3.3"
        canonical: build-provenance
        satisfied_by: [slsa-provenance]
      - id: PW.4.4
        name: "Verify third-party components"
        description: "Verify that acquired third-party components comply with requirements — identify them and check them for known vulnerabilities."
        citation: "NIST SP 800-218 v1.1 — PW.4.4"
        canonical: third-party-component-verification
        satisfied_by: [thirdparty-identifiers, cve-triage]
      - id: PW.6.2
        name: "Enable build/link hardening features (NX/DEP-compatible executables)"
        description: "Enable compiler/linker exploit-mitigation features — here, that shipped executables declare NX_COMPAT so W^X can be enforced."
        citation: "NIST SP 800-218 v1.1 — PW.6.2"
        canonical: memory-protection-nx
        satisfied_by: [binary-hardening]
      - id: RV.1.1
        name: "Ongoing vulnerability discovery + triage"
        description: "Continuously gather information on and analyze vulnerabilities in the software and its dependencies."
        citation: "NIST SP 800-218 v1.1 — RV.1.1"
        canonical: vulnerability-management
        satisfied_by: [cve-triage, vex-adjudicated]

  sp-800-53:
    name: "NIST SP 800-53 Rev 5 (SR/SI/CM/RA)"
    help: https://csf.tools/reference/nist-sp-800-53/r5/
    controls:
      - id: SI-7
        name: "Software/firmware integrity — detect unauthorized change"
        description: "Employ integrity-verification tools to detect unauthorized changes to software and firmware."
        citation: "NIST SP 800-53 Rev 5 — SI-7"
        canonical: software-integrity
        satisfied_by: [reconcile-membership, component-integrity]
      - id: SI-7(1)
        name: "Integrity checks over components"
        description: "Perform an integrity check of the specified software/firmware at defined transitional states (here: each shipped component's bytes vs its declared hash)."
        citation: "NIST SP 800-53 Rev 5 — SI-7(1)"
        canonical: component-integrity-check
        satisfied_by: [component-integrity, component-byte-integrity]
      - id: SI-7(15)
        name: "Code authentication by a trusted signer"
        description: "Implement cryptographic mechanisms to authenticate software/firmware before installation (a trusted, pinned signer identity)."
        citation: "NIST SP 800-53 Rev 5 — SI-7(15)"
        canonical: code-authentication-signed
        satisfied_by: [signer-identity-pinned]
      - id: SI-16
        name: "Memory protection — W^X-ready modules (declared NX_COMPAT posture)"
        description: "Implement controls to protect memory from unauthorized code execution — here, modules declare NX_COMPAT so data pages can be marked non-executable."
        citation: "NIST SP 800-53 Rev 5 — SI-16"
        canonical: memory-protection-nx
        satisfied_by: [binary-hardening]
      - id: CM-8(3)
        name: "Unauthorized-component detection"
        description: "Detect the presence of unauthorized components (modules present in the image but not declared in the SBOM)."
        citation: "NIST SP 800-53 Rev 5 — CM-8(3)"
        canonical: unauthorized-component-detection
        satisfied_by: [reconcile-membership]
      - id: CM-14
        name: "Signed components"
        description: "Prevent installation of software/firmware components without verification that the component has been signed by a trusted source."
        citation: "NIST SP 800-53 Rev 5 — CM-14"
        canonical: code-authentication-signed
        satisfied_by: [signer-identity-pinned]
      - id: CM-8
        name: "System component inventory"
        description: "Develop and maintain an accurate, up-to-date inventory of system components (here: the SBOM, reconciled against the shipped image, with every hashable module carrying an integrity hash)."
        citation: "NIST SP 800-53 Rev 5 — CM-8"
        canonical: component-inventory
        satisfied_by: [sbom-present, reconcile-membership, component-integrity]
      - id: SR-4
        name: "Provenance"
        description: "Document, monitor, and maintain valid provenance for systems, components, and associated data."
        citation: "NIST SP 800-53 Rev 5 — SR-4"
        canonical: build-provenance
        satisfied_by: [slsa-level-floor]
      - id: SR-4(3)
        name: "Validate genuine and not altered"
        description: "Employ controls to validate that the component received is genuine and has not been altered — the full anchored evidence chain over the firmware digest."
        citation: "NIST SP 800-53 Rev 5 — SR-4(3)"
        canonical: genuine-and-unaltered
        satisfied_by: [slsa-level-floor, evidence-chain-bound, reconcile-membership, firmware-digest-anchor, component-byte-integrity]
      - id: RA-5
        name: "Vulnerability scanning (+ known-exploited prioritization)"
        description: "Scan for vulnerabilities in the system and its components and analyze the results — including prioritizing any component vulnerability that is on the CISA Known Exploited Vulnerabilities (KEV) catalog."
        citation: "NIST SP 800-53 Rev 5 — RA-5 (with CISA BOD 22-01 KEV prioritization)"
        canonical: vulnerability-management
        satisfied_by: [cve-triage, no-kev-component]

  sp-800-193:
    name: "NIST SP 800-193 — Platform Firmware Resiliency (Protection)"
    help: https://csrc.nist.gov/pubs/sp/800/193/final
    controls:
      - id: "4.2.3"
        name: "SMM protection (System Management Mode isolation)"
        description: "The platform protects the code and data used for critical firmware functions, including System Management Mode (SMM) — here, CHIPSEC confirms SMM protection is in place (SMRAM locked / SMM guarded). CAVEAT: OVMF/QEMU target with sample/illustrative chipsec.json; SMRR reports N/A with no hardware root of trust."
        citation: "NIST SP 800-193 — §4.2.3 (Protection of critical firmware functions — SMM)"
        canonical: platform-smm-protection
        satisfied_by: [platform-protection-posture]
      - id: "4.2"
        name: "Protection posture (config-level, via CHIPSEC on OVMF target)"
        description: "Platform firmware and its critical data are protected from unauthorized modification (write-protection posture, checked via CHIPSEC). CAVEAT: this is the OVMF/QEMU target with NO hardware root of trust; the demo's chipsec.json is sample/illustrative data, not a live CHIPSEC run, and not all critical modules are applicable (HW-root SPI descriptor/lock checks honestly report N/A on QEMU) — evidence-shaped config-level posture, not enforced platform resiliency."
        citation: "NIST SP 800-193 — §4.2 (Protection)"
        canonical: platform-firmware-protection
        satisfied_by: [chipsec-posture]
      - id: "4.3.1"
        name: "Detection of corrupted firmware code — admission-time, off-device"
        description: "Detect corruption of firmware code against an authorized reference. CEILING (verbatim): this is ADMISSION-TIME / OFF-DEVICE detection — the anchored evidence chain plus a fresh flash-time image measurement compared to the build reference off the device — it is NOT the on-device, boot-time Root of Trust for Detection (measured boot + golden RIM) that §4.3.1 ultimately envisions. Requires a genuine flash-time FW_IMAGE measurement: in DEV_ASSUME_FWIMAGE (offline/CI) mode leg-3 is copied from the build self-claim, so this control is honestly NOT satisfied there."
        citation: "NIST SP 800-193 — §4.3.1 (Detection of Corrupted Code)"
        canonical: firmware-corruption-detection
        advisory: true
        satisfied_by: [component-byte-integrity, firmware-digest-anchor, firmware-freshly-measured]

  s2c2f:
    name: "OpenSSF S2C2F v2"
    help: https://github.com/ossf/s2c2f
    controls:
      - id: SCA-1
        name: "Scan OSS for known vulnerabilities"
        description: "Scan open-source software components for known vulnerabilities and triage the results."
        citation: "OpenSSF S2C2F v2 — SCA-1"
        canonical: vulnerability-management
        satisfied_by: [cve-triage, vex-adjudicated]
      - id: SCA-2
        name: "Scan OSS for licenses"
        description: "Scan open-source components to identify their licenses."
        citation: "OpenSSF S2C2F v2 — SCA-2"
        canonical: component-license-identification
        satisfied_by: [thirdparty-identifiers]
      - id: REB-3
        name: "SBOM for rebuilt/build tooling"
        description: "Generate a verifiable SBOM for the build toolchain, with tools pinned and signed."
        citation: "OpenSSF S2C2F v2 — REB-3"
        canonical: toolchain-integrity
        satisfied_by: [build-tools-signed]
      - id: AUD-3
        name: "Validate integrity of ingested artifacts / shipped bytes"
        description: "Validate the integrity of ingested artifacts by comparing the shipped bytes against their declared references — here, byte-integrity of every hashable module plus reconcile membership of the declared SBOM against the observed image."
        citation: "OpenSSF S2C2F v2 — AUD-3"
        canonical: ingested-artifact-integrity
        satisfied_by: [component-byte-integrity, reconcile-membership]

  cra-bsi-cisa:
    name: "EU CRA / BSI TR-03183-2 / CISA 2026 Minimum Elements (SBOM obligations)"
    help: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    controls:
      - id: cra-annex-I-II-1
        name: "CRA Annex I Part II(1): SBOM exists, machine-readable"
        description: "Produce an SBOM covering at least the top-level dependencies, in a commonly used, machine-readable format."
        citation: "EU CRA (Reg. 2024/2847) — Annex I, Part II(1); BSI TR-03183-2"
        canonical: sbom-exists
        satisfied_by: [sbom-present, reconcile-membership]
      - id: cisa-hash
        name: "CISA 2026: component hash"
        description: "Each SBOM component carries a cryptographic hash of the component."
        citation: "CISA 2026 Minimum Elements for an SBOM — Component Hash"
        canonical: component-integrity-check
        satisfied_by: [component-integrity]
      - id: cisa-fw-binding
        name: "SBOM bound to the firmware image digest — our extension, beyond CISA/NTIA minimum elements"
        description: "The SBOM and its evidence are cryptographically bound to the digest of the actual firmware image they describe. This exceeds the CISA/NTIA SBOM minimum elements (image-digest binding is not one of them); we include it as our own admission-gate requirement."
        citation: "Beyond CISA/NTIA SBOM minimum elements (2026) — our extension, not a CISA-mandated element"
        canonical: firmware-image-binding
        satisfied_by: [firmware-digest-anchor]
      - id: cisa-license-id
        name: "CISA 2026: license + software identifiers (third-party)"
        description: "Each third-party component carries its license and a software identifier (PURL/CPE)."
        citation: "CISA 2026 Minimum Elements for an SBOM — License + Software Identifiers"
        canonical: component-license-identification
        satisfied_by: [thirdparty-identifiers]
      - id: cisa-generation-tool
        name: "CISA 2026: generation tool"
        description: "The SBOM declares the tool that generated it (metadata.tools with a name+version — here the edk2 '-Y SBOM' BuildReport generator). HONESTY: this proves the SBOM DECLARES a generation tool, not that that tool actually produced these bytes (cf. vex-adjudicated, which proves a justification is declared)."
        citation: "CISA 2026 Minimum Elements for an SBOM — Generation Tool"
        canonical: sbom-generation-tool
        satisfied_by: [sbom-generation-tool]
      - id: cisa-generation-context
        name: "CISA 2026: generation context"
        description: "The SBOM declares the lifecycle context in which it was generated (metadata.lifecycles[].phase — build-time is the gold-standard context). HONESTY: this proves the SBOM DECLARES a generation context, not that it was in fact generated in that phase."
        citation: "CISA 2026 Minimum Elements for an SBOM — Generation Context"
        canonical: sbom-generation-context
        satisfied_by: [sbom-generation-context]
      - id: cisa-kev
        name: "CISA KEV: no shipped component on the Known Exploited Vulnerabilities catalog"
        description: "No SBOM component declares a CVE that is on the CISA Known Exploited Vulnerabilities (KEV) catalog, unless that CVE carries an explicit exec-risk VEX waiver. BOD 22-01 requires federal agencies to remediate KEV entries on an accelerated timeline; a plain not_affected VEX does NOT silence a KEV finding. HONESTY: KEV membership is matched against the component's DECLARED version (SBOM/grype evidence), not proven runtime exploitability, and data.cisa_kev is a small illustrative seed — refresh it from the live CISA KEV feed."
        citation: "CISA BOD 22-01 — Known Exploited Vulnerabilities Catalog"
        canonical: known-exploited-vulnerabilities
        satisfied_by: [no-kev-component]

  nist-800-147:
    name: "NIST SP 800-147 / 147B + UEFI Secure Boot — BIOS protection & authenticated boot"
    help: https://csrc.nist.gov/pubs/sp/800/147/final
    controls:
      - id: "800-147-flash-wp"
        name: "BIOS flash write-protection"
        description: "The system firmware (BIOS/UEFI) resides in protected, write-protected flash so it cannot be modified except through an authenticated update mechanism — here, CHIPSEC confirms the BIOS write-protection posture (bios_wp). CAVEAT: OVMF/QEMU target, sample/illustrative chipsec.json, not physical silicon and not the authenticated-update pillar."
        citation: "NIST SP 800-147 — BIOS Protection Guidelines (flash write-protection)"
        canonical: platform-firmware-protection
        satisfied_by: [platform-protection-posture]
      - id: "800-147B-secure-boot"
        name: "UEFI Secure Boot enabled + enforcing"
        description: "The platform enforces UEFI Secure Boot: the Secure Boot variables (PK/KEK/db/dbx, SecureBoot=1, SetupMode=0) are provisioned and enforced so only signed boot components execute — here, CHIPSEC confirms secureboot.variables. CAVEAT: OVMF/QEMU target, sample/illustrative chipsec.json, config-level posture not a live hardware-rooted measurement."
        citation: "UEFI Specification 2.10 §32 (Secure Boot) + NIST SP 800-147B (server BIOS protection)"
        canonical: uefi-secure-boot
        satisfied_by: [uefi-secure-boot-posture]
