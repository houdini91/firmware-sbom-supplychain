<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 372" width="1040" height="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Admission-time gate today (solid); runtime measured-boot attestation next (dashed)">
  <defs>
    <marker id="fr-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="fr-arwm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="fr-arwt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
  </defs>

  <text x="40" y="32" font-size="18" font-weight="700" fill="#475569">The horizon: admission-time today, runtime attestation next</text>
  <text x="40" y="54" font-size="12.5" fill="#64748b">Today&#8217;s gate proves the bytes <tspan font-weight="600" fill="#475569">at rest</tspan>. The next evidence class proves what <tspan font-weight="600" fill="#475569">actually booted</tspan>.</text>

  <!-- Admission band (solid, implemented) -->
  <text x="40" y="86" font-size="12" font-weight="700" fill="#0d9488">ADMISSION TIME &#8212; artifacts at rest (implemented today)</text>
  <g font-size="12">
    <rect x="40" y="96" width="185" height="60" rx="10" fill="#64748b" fill-opacity="0.06" stroke="#64748b" stroke-width="1.5"/>
    <text x="132" y="122" text-anchor="middle" font-weight="600" fill="#475569">Build image</text>
    <text x="132" y="140" text-anchor="middle" font-size="10.5" fill="#94a3b8">+ generate SBOM</text>
    <rect x="245" y="96" width="185" height="60" rx="10" fill="#64748b" fill-opacity="0.06" stroke="#64748b" stroke-width="1.5"/>
    <text x="337" y="122" text-anchor="middle" font-weight="600" fill="#475569">Sign + verify</text>
    <text x="337" y="140" text-anchor="middle" font-size="10.5" fill="#94a3b8">provenance, reconcile</text>
    <rect x="450" y="96" width="170" height="60" rx="10" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-width="1.8"/>
    <text x="535" y="122" text-anchor="middle" font-weight="700" fill="#475569">OPA gate</text>
    <text x="535" y="140" text-anchor="middle" font-size="10.5" fill="#64748b">28 signed checks</text>
    <rect x="640" y="96" width="190" height="60" rx="10" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="1.8"/>
    <text x="735" y="122" text-anchor="middle" font-weight="700" fill="#0d9488">Signed VSA</text>
    <text x="735" y="140" text-anchor="middle" font-size="10.5" fill="#64748b">subject = firmware digest D</text>
  </g>
  <line x1="225" y1="126" x2="243" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#fr-arw)"/>
  <line x1="430" y1="126" x2="448" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#fr-arw)"/>
  <line x1="620" y1="126" x2="638" y2="126" stroke="#0d9488" stroke-width="1.8" marker-end="url(#fr-arwt)"/>

  <!-- derive golden RIM (dashed, links the two bands) -->
  <rect x="545" y="176" width="300" height="32" rx="9" fill="#0d9488" fill-opacity="0.05" stroke="#0d9488" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="561" y="196" font-size="11" fill="#64748b">Golden RIM &#8212; reference values, derived from the SBOM/VSA</text>
  <path d="M735 156 C 735 168, 720 176, 705 176" fill="none" stroke="#0d9488" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#fr-arwt)"/>
  <text x="748" y="172" font-size="9.5" fill="#94a3b8">derive</text>

  <!-- Runtime band (dashed, future) -->
  <text x="40" y="234" font-size="12" font-weight="700" fill="#94a3b8">RUNTIME &#8212; measured boot on the device (future / aspirational)</text>
  <g font-size="12">
    <rect x="40" y="244" width="185" height="60" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="132" y="270" text-anchor="middle" font-weight="600" fill="#64748b">Device boot</text>
    <text x="132" y="288" text-anchor="middle" font-size="10.5" fill="#94a3b8">code executes</text>
    <rect x="245" y="244" width="205" height="60" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="347" y="270" text-anchor="middle" font-weight="600" fill="#64748b">TPM quote</text>
    <text x="347" y="288" text-anchor="middle" font-size="10.5" fill="#94a3b8">signed PCR measurements</text>
    <rect x="470" y="244" width="205" height="60" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="572" y="270" text-anchor="middle" font-weight="600" fill="#64748b">Appraise vs golden RIM</text>
    <text x="572" y="288" text-anchor="middle" font-size="10.5" fill="#94a3b8">did it boot what we approved?</text>
    <rect x="695" y="244" width="185" height="60" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="787" y="269" text-anchor="middle" font-size="11" fill="#0d9488" font-weight="600">&#10003; device trusted</text>
    <text x="787" y="288" text-anchor="middle" font-size="11" fill="#e2504e" font-weight="600">&#10007; drift &#8594; quarantine</text>
  </g>
  <line x1="225" y1="274" x2="243" y2="274" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fr-arwm)"/>
  <line x1="450" y1="274" x2="468" y2="274" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fr-arwm)"/>
  <line x1="675" y1="274" x2="693" y2="274" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fr-arwm)"/>
  <path d="M620 208 C 620 224, 600 238, 585 242" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#fr-arwm)"/>

  <!-- legend + honest note -->
  <g transform="translate(40,336)">
    <line x1="0" y1="-3" x2="26" y2="-3" stroke="#64748b" stroke-width="1.6"/>
    <text x="32" y="1" font-size="11" fill="#64748b">implemented (admission-time)</text>
    <line x1="220" y1="-3" x2="246" y2="-3" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="252" y="1" font-size="11" fill="#64748b">future (runtime attestation)</text>
  </g>
  <text x="40" y="362" font-size="10.5" fill="#94a3b8">Needs a new evidence class &#8212; a signed TPM quote + a signed golden RIM. Documented as direction, not shipped (see FUTURISTIC in FRAMEWORKS.md).</text>
</svg>
