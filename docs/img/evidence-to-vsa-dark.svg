<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Evidence atoms feed the OPA gate, which emits a signed SLSA VSA whose subject is the firmware digest D">
  <defs>
    <marker id="arw3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arw3t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <text x="40" y="38" font-size="17" font-weight="700" fill="#e2e8f0">Evidence &#8594; gate &#8594; a signed, re-checkable verdict</text>
  <text x="40" y="58" font-size="12.5" fill="#94a3b8">The gate ANDs every atom into one SLSA VSA whose subject is the firmware bytes &#8212; not a JSON file.</text>

  <!-- Evidence panel -->
  <rect x="40" y="76" width="300" height="346" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="56" y="100" font-size="13" font-weight="700" fill="#e2e8f0">Signed evidence &#160;<tspan fill="#94a3b8" font-weight="400">(E1&#8211;E11)</tspan></text>

  <g font-size="11.5">
    <rect x="56" y="110" width="268" height="30" rx="7" fill="#94a3b8" fill-opacity="0.06" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="70" y="129" fill="#94a3b8"><tspan font-weight="700" fill="#e2e8f0">E1</tspan>  SBOM &#183; CycloneDX 1.6</text>
    <rect x="56" y="147" width="268" height="30" rx="7" fill="#94a3b8" fill-opacity="0.06" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="70" y="166" fill="#94a3b8"><tspan font-weight="700" fill="#e2e8f0">E2</tspan>  SLSA L2 provenance</text>
    <rect x="56" y="184" width="268" height="30" rx="7" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="70" y="203" fill="#94a3b8"><tspan font-weight="700" fill="#2dd4bf">E3</tspan>  Reconcile + byte-integrity</text>
    <rect x="56" y="221" width="268" height="30" rx="7" fill="#94a3b8" fill-opacity="0.06" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="70" y="240" fill="#94a3b8"><tspan font-weight="700" fill="#e2e8f0">E4</tspan>  CVE scan + VEX triage</text>
    <rect x="56" y="258" width="268" height="30" rx="7" fill="#94a3b8" fill-opacity="0.06" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="70" y="277" fill="#94a3b8"><tspan font-weight="700" fill="#e2e8f0">E5</tspan>  Signature + signer identity</text>
    <rect x="56" y="295" width="268" height="30" rx="7" fill="#94a3b8" fill-opacity="0.06" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="70" y="314" fill="#94a3b8"><tspan font-weight="700" fill="#e2e8f0">E7</tspan>  Build-tools SBOM (pinned)</text>
    <rect x="56" y="332" width="268" height="30" rx="7" fill="#94a3b8" fill-opacity="0.06" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="70" y="351" fill="#94a3b8"><tspan font-weight="700" fill="#e2e8f0">E10</tspan> CHIPSEC platform posture</text>
    <rect x="56" y="369" width="268" height="30" rx="7" fill="#94a3b8" fill-opacity="0.06" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="70" y="388" fill="#94a3b8"><tspan font-weight="700" fill="#e2e8f0">E11</tspan> Binary-hardening posture</text>
  </g>

  <!-- converging arrow to gate -->
  <path d="M344 250 C 388 250, 392 249, 424 249" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw3)"/>

  <!-- Gate -->
  <rect x="426" y="196" width="176" height="108" rx="12" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-width="2.2"/>
  <text x="514" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">OPA gate</text>
  <text x="514" y="254" text-anchor="middle" font-size="11" fill="#94a3b8">32 verifier reports</text>
  <text x="514" y="271" text-anchor="middle" font-size="11" fill="#94a3b8">ANDed &#8594; one verdict</text>
  <text x="514" y="291" text-anchor="middle" font-size="10.5" fill="#2dd4bf" font-weight="600">non-vacuous, coverage-bound</text>

  <!-- gate to VSA -->
  <line x1="604" y1="250" x2="684" y2="250" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#arw3t)"/>

  <!-- VSA card -->
  <rect x="688" y="92" width="312" height="316" rx="12" fill="#2dd4bf" fill-opacity="0.06" stroke="#2dd4bf" stroke-width="1.8"/>
  <text x="706" y="118" font-size="14" font-weight="700" fill="#2dd4bf">Signed SLSA VSA</text>
  <g font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="706" y="146" fill="#64748b">predicateType</text>
    <text x="706" y="162" fill="#94a3b8">slsa.dev/verification_summary/v1</text>
    <text x="706" y="190" fill="#64748b">subject: firmware-image  <tspan fill="#2dd4bf" font-weight="700">(digest D)</tspan></text>
    <text x="706" y="206" fill="#94a3b8">sha256:7965c317&#8230;62fb8f37</text>
    <text x="706" y="236" fill="#64748b">verificationResult</text>
  </g>
  <rect x="706" y="244" width="86" height="24" rx="7" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-width="1.3"/>
  <text x="749" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#2dd4bf">PASSED</text>
  <text x="706" y="290" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#94a3b8">verifiedLevels: [SLSA_BUILD_LEVEL_2]</text>

  <line x1="706" y1="306" x2="982" y2="306" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="706" y="324" font-size="10.5" fill="#64748b" font-style="italic">extensions (in-toto is extensible)</text>
  <g font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#94a3b8">
    <text x="706" y="348">verifierReports[]  <tspan fill="#e2e8f0" font-weight="700">32</tspan> observations</text>
    <text x="706" y="368">controlAssessments[]  <tspan fill="#e2e8f0" font-weight="700">46</tspan> findings</text>
    <text x="706" y="388" fill="#64748b">across 8 frameworks, each cited</text>
  </g>

  <!-- consumer note -->
  <text x="40" y="452" font-size="11.5" fill="#94a3b8">A consumer re-hashes their own image and checks it against subject <tspan font-weight="600" fill="#e2e8f0">D</tspan> &#8212; the verdict is bound to the bytes, so anyone can re-verify it.</text>
</svg>
