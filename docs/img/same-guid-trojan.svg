<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 486" width="980" height="486" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="The same-GUID trojan: membership passes, byte-integrity catches the swapped module">
  <defs>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="48" y="36" font-size="18" font-weight="700" fill="#475569">The same-GUID trojan &#8212; why an inventory check isn&#8217;t enough</text>
  <text x="48" y="58" font-size="12.5" fill="#64748b">A module&#8217;s code is swapped for malware but its <tspan font-weight="600" fill="#475569">FILE_GUID is kept identical</tspan>. Membership is fooled; byte-integrity is not.</text>

  <!-- Declared card -->
  <rect x="48" y="82" width="392" height="128" rx="12" fill="#64748b" fill-opacity="0.06" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="76" cy="105" r="8.5" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="76" y="109" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">1</text>
  <text x="94" y="110" font-size="13" font-weight="700" fill="#475569">Declared in the signed SBOM</text>
  <text x="68" y="142" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#64748b">FILE_GUID  2ec9da37&#8230;</text>
  <text x="68" y="168" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#64748b">SHA-256    <tspan fill="#0d9488" font-weight="700">71a4&#8230;3c</tspan></text>
  <text x="68" y="194" font-size="11" fill="#94a3b8" font-style="italic">what the build promised</text>

  <!-- Shipped card -->
  <rect x="540" y="82" width="392" height="128" rx="12" fill="#e2504e" fill-opacity="0.05" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="568" cy="105" r="8.5" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="568" y="109" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">2</text>
  <text x="586" y="110" font-size="13" font-weight="700" fill="#475569">Shipped module (code swapped)</text>
  <text x="560" y="142" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#64748b">FILE_GUID  2ec9da37&#8230;</text>
  <rect x="726" y="130" width="74" height="17" rx="8.5" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="1"/>
  <text x="763" y="142.5" text-anchor="middle" font-size="10" fill="#0d9488" font-weight="600">unchanged</text>
  <text x="560" y="168" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#64748b">SHA-256    <tspan fill="#e2504e" font-weight="700">dead&#8230;be</tspan></text>
  <rect x="726" y="156" width="66" height="17" rx="8.5" fill="#e2504e" fill-opacity="0.12" stroke="#e2504e" stroke-width="1"/>
  <text x="759" y="168.5" text-anchor="middle" font-size="10" fill="#e2504e" font-weight="600">swapped</text>
  <text x="560" y="194" font-size="11" fill="#94a3b8" font-style="italic">same badge, different code</text>

  <!-- swap arrow between cards -->
  <line x1="444" y1="146" x2="536" y2="146" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw2)"/>
  <text x="490" y="136" text-anchor="middle" font-size="10" fill="#64748b">swap</text>

  <!-- Check 1: membership (fooled) -->
  <rect x="48" y="248" width="884" height="80" rx="12" fill="#d97706" fill-opacity="0.05" stroke="#64748b" stroke-width="1.5"/>
  <text x="70" y="282" font-size="13.5" font-weight="700" fill="#475569">Membership check</text>
  <text x="70" y="303" font-size="11" fill="#64748b">is the FILE_GUID present?</text>
  <text x="360" y="284" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#64748b">2ec9da37&#8230;  ==  2ec9da37&#8230;</text>
  <text x="360" y="304" font-size="11" fill="#94a3b8">the GUID is on the list, looks complete</text>
  <rect x="726" y="270" width="184" height="36" rx="9" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.5"/>
  <text x="818" y="293" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">PASS &#8212; fooled</text>

  <!-- Check 2: byte-integrity (caught) -->
  <rect x="48" y="344" width="884" height="92" rx="12" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488" stroke-width="2"/>
  <text x="70" y="380" font-size="13.5" font-weight="700" fill="#0d9488">Byte-integrity check</text>
  <text x="70" y="401" font-size="11" fill="#64748b">do the shipped bytes match the declared hash?</text>
  <text x="360" y="382" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#64748b">declared <tspan fill="#0d9488" font-weight="700">71a4&#8230;</tspan>  &#33;=  shipped <tspan fill="#e2504e" font-weight="700">dead&#8230;</tspan></text>
  <text x="360" y="402" font-size="11" fill="#94a3b8">the fingerprint broke; the badge can&#8217;t hide it</text>
  <rect x="726" y="368" width="184" height="44" rx="9" fill="#e2504e" fill-opacity="0.12" stroke="#e2504e" stroke-width="1.8"/>
  <text x="818" y="389" text-anchor="middle" font-size="13" font-weight="700" fill="#e2504e">DENY &#8212; caught</text>
  <text x="818" y="404" text-anchor="middle" font-size="9.5" fill="#e2504e">release blocked</text>

  <text x="48" y="470" font-size="11.5" fill="#64748b">The attacker forges the <tspan font-weight="600" fill="#475569">badge</tspan> (GUID) for free &#8212; but not the <tspan font-weight="600" fill="#475569">fingerprint</tspan> (hash), which is computed from the bytes themselves.</text>
</svg>
