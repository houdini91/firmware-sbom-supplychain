<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Admission-time gate today (solid); deploy-time on-device reconcile, implemented but needs a device or image (solid, indigo); runtime measured-boot attestation next (dashed)">
  <defs>
    <marker id="fr-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="fr-arwm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="fr-arwt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="fr-arwi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#818cf8"/></marker>
  </defs>

  <text x="40" y="32" font-size="18" font-weight="700" fill="#e2e8f0">The horizon: admission-time today, deploy-time on-device now, runtime attestation next</text>
  <text x="40" y="54" font-size="12.5" fill="#94a3b8">Today&#8217;s gate proves the bytes <tspan font-weight="600" fill="#e2e8f0">at rest</tspan>; deploy-time reconcile checks what is <tspan font-weight="600" fill="#e2e8f0">actually flashed</tspan>; runtime proves what <tspan font-weight="600" fill="#e2e8f0">actually booted</tspan>.</text>

  <!-- Admission band (solid, implemented) -->
  <text x="40" y="86" font-size="12" font-weight="700" fill="#2dd4bf">ADMISSION TIME &#8212; artifacts at rest (implemented today)</text>
  <g font-size="12">
    <rect x="40" y="96" width="185" height="60" rx="10" fill="#94a3b8" fill-opacity="0.06" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="132" y="122" text-anchor="middle" font-weight="600" fill="#e2e8f0">Build firmware</text>
    <text x="132" y="140" text-anchor="middle" font-size="10.5" fill="#64748b">+ generate SBOM</text>
    <rect x="245" y="96" width="185" height="60" rx="10" fill="#94a3b8" fill-opacity="0.06" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="337" y="122" text-anchor="middle" font-weight="600" fill="#e2e8f0">Sign + verify</text>
    <text x="337" y="140" text-anchor="middle" font-size="10.5" fill="#64748b">provenance, reconcile</text>
    <rect x="450" y="96" width="170" height="60" rx="10" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-width="1.8"/>
    <text x="535" y="122" text-anchor="middle" font-weight="700" fill="#e2e8f0">OPA gate</text>
    <text x="535" y="140" text-anchor="middle" font-size="10.5" fill="#94a3b8">32 signed checks</text>
    <rect x="640" y="96" width="190" height="60" rx="10" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-width="1.8"/>
    <text x="735" y="122" text-anchor="middle" font-weight="700" fill="#2dd4bf">Signed VSA</text>
    <text x="735" y="140" text-anchor="middle" font-size="10.5" fill="#94a3b8">subject = firmware digest D</text>
  </g>
  <line x1="225" y1="126" x2="243" y2="126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fr-arw)"/>
  <line x1="430" y1="126" x2="448" y2="126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fr-arw)"/>
  <line x1="620" y1="126" x2="638" y2="126" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#fr-arwt)"/>

  <!-- Deploy-time band (solid, indigo: implemented, needs a device/image) -->
  <text x="40" y="190" font-size="12" font-weight="700" fill="#818cf8">DEPLOY TIME &#8212; on device / image reconcile (implemented &#183; needs a device or image)</text>
  <g font-size="12">
    <rect x="40" y="200" width="185" height="60" rx="10" fill="#818cf8" fill-opacity="0.08" stroke="#818cf8" stroke-width="1.5"/>
    <text x="132" y="226" text-anchor="middle" font-weight="600" fill="#e2e8f0">CHIPSEC uefi decode</text>
    <text x="132" y="244" text-anchor="middle" font-size="10.5" fill="#94a3b8">2nd independent carver</text>
    <rect x="245" y="200" width="185" height="60" rx="10" fill="#818cf8" fill-opacity="0.08" stroke="#818cf8" stroke-width="1.5"/>
    <text x="337" y="226" text-anchor="middle" font-weight="600" fill="#e2e8f0">Normalize + reconcile</text>
    <text x="337" y="244" text-anchor="middle" font-size="10.5" fill="#94a3b8">GUID-bound &#183; bidirectional</text>
    <rect x="450" y="200" width="185" height="60" rx="10" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" stroke-width="1.8"/>
    <text x="542" y="226" text-anchor="middle" font-weight="700" fill="#818cf8">deploy-time-reconcile</text>
    <text x="542" y="244" text-anchor="middle" font-size="10.5" fill="#94a3b8">verified &#183; DENY on drift</text>
    <rect x="655" y="200" width="185" height="60" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="747" y="226" text-anchor="middle" font-weight="600" fill="#94a3b8">Live-silicon SPI readback</text>
    <text x="747" y="244" text-anchor="middle" font-size="10" fill="#64748b">on real hardware &#8212; roadmap (A6)</text>
  </g>
  <line x1="225" y1="230" x2="243" y2="230" stroke="#818cf8" stroke-width="1.5" marker-end="url(#fr-arwi)"/>
  <line x1="430" y1="230" x2="448" y2="230" stroke="#818cf8" stroke-width="1.5" marker-end="url(#fr-arwi)"/>
  <line x1="635" y1="230" x2="653" y2="230" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fr-arwm)"/>
  <!-- deploy-time reuses the SAME signed, build-born SBOM baseline the admission gate produced -->
  <path d="M337 156 C 337 172, 337 184, 337 198" fill="none" stroke="#818cf8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#fr-arwi)"/>
  <text x="345" y="180" font-size="9.5" fill="#64748b">same signed SBOM</text>

  <!-- Golden RIM (dashed) — derived from the VSA down the right margin, feeds the runtime appraise -->
  <rect x="545" y="294" width="300" height="32" rx="9" fill="#2dd4bf" fill-opacity="0.05" stroke="#2dd4bf" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="561" y="314" font-size="11" fill="#94a3b8">Golden RIM &#8212; reference values, derived from the SBOM/VSA</text>
  <path d="M830 126 H905 V310 H849" fill="none" stroke="#2dd4bf" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#fr-arwt)"/>
  <text x="912" y="220" font-size="9.5" fill="#64748b">derive</text>

  <!-- Runtime band (dashed, future) -->
  <text x="40" y="360" font-size="12" font-weight="700" fill="#64748b">RUNTIME &#8212; measured boot on the device (future / aspirational)</text>
  <g font-size="12">
    <rect x="40" y="370" width="185" height="60" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="132" y="396" text-anchor="middle" font-weight="600" fill="#94a3b8">Device boot</text>
    <text x="132" y="414" text-anchor="middle" font-size="10.5" fill="#64748b">code executes</text>
    <rect x="245" y="370" width="205" height="60" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="347" y="396" text-anchor="middle" font-weight="600" fill="#94a3b8">TPM quote</text>
    <text x="347" y="414" text-anchor="middle" font-size="10.5" fill="#64748b">signed PCR measurements</text>
    <rect x="470" y="370" width="205" height="60" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="572" y="396" text-anchor="middle" font-weight="600" fill="#94a3b8">Appraise vs golden RIM</text>
    <text x="572" y="414" text-anchor="middle" font-size="10.5" fill="#64748b">did it boot what we approved?</text>
    <rect x="695" y="370" width="185" height="60" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="787" y="395" text-anchor="middle" font-size="11" fill="#2dd4bf" font-weight="600">&#10003; device trusted</text>
    <text x="787" y="414" text-anchor="middle" font-size="11" fill="#f87171" font-weight="600">&#10007; drift &#8594; quarantine</text>
  </g>
  <line x1="225" y1="400" x2="243" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fr-arwm)"/>
  <line x1="450" y1="400" x2="468" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fr-arwm)"/>
  <line x1="675" y1="400" x2="693" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fr-arwm)"/>
  <path d="M620 326 C 620 348, 600 366, 585 368" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#fr-arwm)"/>

  <!-- legend + honest note -->
  <g transform="translate(40,462)">
    <line x1="0" y1="-3" x2="26" y2="-3" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="32" y="1" font-size="11" fill="#94a3b8">implemented (admission)</text>
    <line x1="200" y1="-3" x2="226" y2="-3" stroke="#818cf8" stroke-width="1.6"/>
    <text x="232" y="1" font-size="11" fill="#94a3b8">implemented (deploy-time, needs a device/image)</text>
    <line x1="540" y1="-3" x2="566" y2="-3" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="572" y="1" font-size="11" fill="#94a3b8">future / roadmap (runtime attestation &#183; SPI readback)</text>
  </g>
  <text x="40" y="486" font-size="10.5" fill="#64748b">Deploy-time reconcile is implemented (needs a device or image). The runtime measured-boot bind + live-silicon SPI readback (A6) stay direction, not shipped (see FUTURISTIC in FRAMEWORKS.md).</text>
</svg>
