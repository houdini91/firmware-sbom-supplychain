name: firmware-supply-chain

# Reference workflow: keyless-sign the firmware SBOM, verify it, and gate deployment on policy —
# every gate input derived from evidence (shared assembler), CVE scan run for real, and an
# in-pipeline negative test proving the gate blocks a post-sign tamper.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read   # least-privilege default; each job opts into more

jobs:
  attest-and-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # keyless OIDC signing (this job only)
      packages: write        # push the SBOM to ghcr for the cosign-native policy demo (feature b)
      attestations: write    # actions/attest-build-provenance (platform-generated SLSA provenance)
    env:
      PRED_TYPE: https://firmware-sbom-supplychain/reconcile/v1
      BUILDER_ID: https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@${{ github.ref }}
      SOURCE_REPO: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OPA (pinned + SHA-verified)
        run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.18.2/opa_linux_amd64_static
          echo "9903e5125ac281104f2c4b7371d10cc3b74a98933743fcbfc174f9bf0ab20de8  /usr/local/bin/opa" | sha256sum -c -
          chmod +x /usr/local/bin/opa

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # SLSA Build L2: GitHub's attestation store generates AND signs the provenance from the run's own
      # metadata, so the tenant workflow cannot forge the predicate content. This is the distinction that a
      # self-signed predicate (SLSA L1) cannot make: authenticity of the provenance itself, not just the
      # signature. Requires the attestation store, i.e. a public repo (or GitHub Enterprise).
      - name: Generate SLSA build provenance for the SBOM (platform-generated, SLSA L2)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: inputs/sbom.cdx.json

      - name: Verify the SLSA provenance (hard gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify inputs/sbom.cdx.json --repo "${{ github.repository }}"
          echo "✓ SLSA build provenance verified (platform-generated by GitHub — SLSA Build L2)"

      - name: Keyless attest the SBOM (predicate = reconcile verdict)
        run: |
          cosign attest-blob --yes \
            --predicate inputs/reconcile-verdict.json \
            --type "$PRED_TYPE" \
            --bundle inputs/sbom.att.bundle \
            inputs/sbom.cdx.json

      - name: Keyless verify the attestation
        id: verify
        run: |
          if cosign verify-blob-attestation \
              --certificate-identity "$BUILDER_ID" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --type "$PRED_TYPE" \
              --bundle inputs/sbom.att.bundle \
              inputs/sbom.cdx.json; then
            echo "sig=true"  >> "$GITHUB_OUTPUT"
          else
            echo "sig=false" >> "$GITHUB_OUTPUT"
          fi

      - name: CVE scan (grype via anchore/scan-action)   # F1 + idiomatic action
        id: scan
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          sbom: inputs/sbom.cdx.json
          output-format: json
          fail-build: false
          severity-cutoff: critical

      - name: Collect scan results
        run: cp "${{ steps.scan.outputs.json }}" inputs/grype.json

      # Build-tools SBOM: inventory the CI toolchain (SHA-pinned actions + tool versions) and keyless-sign it,
      # so the *build* supply chain is signed evidence too — not just the firmware product SBOM. Produced +
      # verified BEFORE the gate so `build-tools-signed` (SSDF PO.3.2 / S2C2F REB-3) can consume it as a fact.
      - name: Build-tools SBOM (inventory + keyless-sign the CI toolchain)
        run: |
          ./producers/build-tools/build-tools-sbom.sh inputs/build-tools.cdx.json
          cosign sign-blob --yes --bundle inputs/build-tools.sig.bundle inputs/build-tools.cdx.json
          cosign verify-blob \
            --certificate-identity "$BUILDER_ID" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --bundle inputs/build-tools.sig.bundle inputs/build-tools.cdx.json
          echo "✓ CI toolchain inventoried ($(jq '.components|length' inputs/build-tools.cdx.json) components) + keyless-signed"

      - name: Assemble gate input from verified evidence, then gate
        run: |
          SBOM=inputs/sbom.cdx.json \
          BUNDLE=inputs/sbom.att.bundle \
          SIG=${{ steps.verify.outputs.sig }} \
          BUILDER_ID="$BUILDER_ID" SOURCE_REPO="$SOURCE_REPO" \
          SLSA_VERIFIED=true \
          CHIPSEC_JSON=inputs/chipsec.json \
          BYTE_INTEGRITY_JSON=inputs/byte-integrity.json \
          BUILD_TOOLS_JSON=inputs/build-tools.cdx.json BUILD_TOOLS_SIG=true \
          PROVENANCE_SUBJECT="sha256:$(sha256sum inputs/sbom.cdx.json | cut -d' ' -f1)" \
          DEV_ASSUME_FWIMAGE=1 \
          GRYPE_JSON=inputs/grype.json OUT=inputs/gate-input.json \
          bash oss-lane/assemble-gate-input.sh
          echo "--- gate input ---"; jq '{sbom,attestation,signature,provenance,reconcile:{clean:.reconcile.clean},cve:{n:(.cve.findings|length)}}' inputs/gate-input.json
          VSA_OUT=inputs/vsa.intoto.json OPA=/usr/local/bin/opa ./oss-lane/gate.sh inputs/gate-input.json
          echo "--- VSA (signed gate verdict) ---"; jq '{result:.predicate.verificationResult, levels:.predicate.verifiedLevels, reports:[.predicate.verifierReports[]|{name,isSuccess,controls}]}' inputs/vsa.intoto.json

      - name: Framework coverage from the signed VSA (initiative layer)
        run: |
          pip install --quiet pyyaml
          python3 oss-lane/verify-initiative.py --vsa inputs/vsa.intoto.json

      - name: Sign the gate verdict (SLSA VSA) keyless
        run: |
          cosign sign-blob --yes --bundle inputs/vsa.sig.bundle inputs/vsa.intoto.json
          cosign verify-blob \
            --certificate-identity "$BUILDER_ID" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --bundle inputs/vsa.sig.bundle inputs/vsa.intoto.json
          echo "✓ gate verdict signed + verified as a portable SLSA Verification Summary Attestation"

      - name: Fixture honesty tests + assembler + byte-integrity unit tests
        run: |
          pip install --quiet pyyaml pefile
          OPA=/usr/local/bin/opa ./tests/run.sh
          python3 tests/test_assemble.py
          python3 tests/test_byte_integrity.py

      - name: In-pipeline negative test (F5) — a post-sign tamper must be blocked
        run: OPA=/usr/local/bin/opa ./tests/pipeline-negative.sh

      # Feature (b): cosign's NATIVE policy over an OCI attestation — complementary to the OPA gate above.
      # Uploads the SBOM to ghcr (no oras), keyless-attests the reconcile verdict, then verifies the
      # attestation AGAINST the rego policy in one cosign command. Proven locally (clean=pass / dirty=fail).
      - name: cosign-native OCI policy check (verify-attestation --policy)
        run: |
          echo "${{ github.token }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          REF="ghcr.io/${{ github.repository }}/sbom:${{ github.sha }}"
          cosign upload blob -f inputs/sbom.cdx.json "$REF"
          cosign attest --yes --predicate inputs/reconcile-verdict.json --type "$PRED_TYPE" "$REF"
          cosign verify-attestation \
            --certificate-identity "$BUILDER_ID" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --type "$PRED_TYPE" \
            --policy oss-lane/policy/cosign-reconcile.rego "$REF"
          echo "✓ cosign-native policy verified the signed reconcile predicate over the OCI artifact"

  # Second lane: the same SBOM, signed + compliance-verified with Valint, keyless via the GitHub
  # workload identity (attest-default: sigstore-github) — just like cosign above.
  valint-lane:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Valint — keyless attest the firmware SBOM
        uses: scribe-security/action-bom@418f70159ff29f5b5b365e0e970228b787260ab2 # v2.0.6
        with:
          target: file:inputs/sbom.cdx.json
          format: attest
          attest-default: sigstore-github
          scribe-disable: "true"

      - name: Valint — verify custom firmware-composition policy
        uses: scribe-security/action-verify@fc908abde0d5d5a931dd030229151033a886505c # v2.0.6
        continue-on-error: true   # report mode: show the compliance run without gating the demo
        with:
          target: file:inputs/sbom.cdx.json
          input-format: attest-cyclonedx-json
          rule: valint-lane/policies/firmware-composition.yaml
          verbose: "2"
          scribe-disable: "true"

      - name: Valint — verify against a framework initiative (SLSA L2)
        uses: scribe-security/action-verify@fc908abde0d5d5a931dd030229151033a886505c # v2.0.6
        continue-on-error: true
        with:
          target: file:inputs/sbom.cdx.json
          input-format: attest-cyclonedx-json
          initiative-name: slsa.l2
          verbose: "2"
          scribe-disable: "true"
